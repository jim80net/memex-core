name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Regression-check exception evidence artifact
        run: |
          set -o pipefail
          node dist/exception-expiry-cli.js --json \
            --manifest .github/security-exceptions/transformers-sharp.json \
            | tee exception-expiry-report.json
          node --input-type=module -e \
            'import { readFile } from "node:fs/promises"; JSON.parse(await readFile("exception-expiry-report.json", "utf8"));'
